<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskbar Hero - Timer de Baús</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-effects">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="app-container">
        <header class="app-header">
            <h1><i class="fa-solid fa-chest"></i> Taskbar Hero Timer</h1>
            <p>Clique em uma fase para iniciar o timer de 13 minutos para o drop do baú.</p>
        </header>

        <main class="grid-container" id="zones-container">
            <!-- Cards will be injected here by JS -->
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
